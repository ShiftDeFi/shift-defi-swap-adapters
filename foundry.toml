[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "prague"
# Remappings come only from remappings.txt, so no local paths reach metadata.
auto_detect_remappings = false
deny = "notes"

optimizer = true
optimizer_runs = 200
# UniswapV3SwapRouter02Adapter.swap is stack-too-deep under the legacy
# pipeline; every build, test and script uses via-IR.
via_ir = true

[lint]
# Audited contracts/ carries known lint findings; with deny = "notes" they
# would fail every build. Run `forge lint` to see them.
lint_on_build = false
exclude_lints = ["mixed-case-function", "mixed-case-variable"]

# Chosen so existing code does not reflow. Pinned forge: v1.8.3.
[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
quote_style = "double"
number_underscore = "preserve"
int_types = "preserve"
single_line_statement_blocks = "preserve"
wrap_comments = false
sort_imports = false
multiline_func_header = "params_first_multi"
ignore = [
    "contracts/dependencies/**",
    # Audited code that forge fmt would rewrap. Remove an entry and run
    # `forge fmt` in the same change that next sends the file to audit.
    "contracts/CustomPool.sol",
    "contracts/OneInchAdapter.sol",
    "contracts/UniswapV3SwapRouter02Adapter.sol",
]

# Fork tests pin their block: vm.createSelectFork(vm.rpcUrl("monad"), <block>).
[rpc_endpoints]
ethereum = "${ETH_RPC_URL}"
monad = "${MONAD_RPC_URL}"

[etherscan]
ethereum = { key = "${ETHERSCAN_API_KEY}" }
monad = { key = "${MONADSCAN_API_KEY}", chain = 143 }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
